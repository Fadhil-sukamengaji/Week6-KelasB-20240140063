<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStore - PAW Week 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SmartStore Catalog</h1>
        <p>Solusi Belanja Smartphone Terpercaya</p>
    </header>

    <main class="container">

        <section class="card">
            <div class="section-header">
                <h2>Katalog Produk Smartphone</h2>
                <button id="reloadBtn" class="secondary-btn">Muat Ulang</button>
            </div>

            <div class="form-group">
                <input type="text" id="searchInput" placeholder="Cari smartphone...">
            </div>

            <div id="loadingStatus" class="status-msg">Memuat data produk...</div>
            <div id="errorStatus" class="status-msg error hidden"></div>

            <div id="productGrid" class="product-grid"></div>
        </section>

        <section class="card">
            <h2>Ulasan & Rating Toko</h2>
            <form id="interactiveForm">
                <div class="form-group">
                    <label for="username">Nama Lengkap:</label>
                    <input type="text" id="username" placeholder="Masukkan nama Anda...">
                </div>

                <div class="form-group">
                    <label>Rating Toko:</label>
                    <div class="star-rating-group">
                        <label class="star-item"><input type="radio" name="rating" value="1"> <span>⭐</span></label>
                        <label class="star-item"><input type="radio" name="rating" value="2"> <span>⭐⭐</span></label>
                        <label class="star-item"><input type="radio" name="rating" value="3"> <span>⭐⭐⭐</span></label>
                        <label class="star-item"><input type="radio" name="rating" value="4"> <span>⭐⭐⭐⭐</span></label>
                        <label class="star-item"><input type="radio" name="rating" value="5"> <span>⭐⭐⭐⭐⭐</span></label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="userMessage">Ulasan / Komentar (Opsional):</label>
                    <textarea id="userMessage" rows="3" placeholder="Tuliskan ulasan pengalaman belanja Anda..."></textarea>
                </div>

                <button type="submit" id="submitBtn">Kirim Ulasan</button>
            </form>

            <div id="formFeedback" class="feedback-msg"></div>

            <div id="formResult" class="result-box hidden">
                <h3>Ulasan Anda Berhasil Disimpan:</h3>
                <p><strong>Nama:</strong> <span id="outName"></span></p>
                <p><strong>Rating:</strong> <span id="outRating"></span></p>
                <p><strong>Ulasan:</strong> <span id="outMessage"></span></p>
                <p class="timestamp"><small>Dikirim pada: <span id="outTime"></span></small></p>
            </div>
        </section>
    </main>

    <footer>
        <p>Fadhil Mudzaki Hartono Putra | 20240140063</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
